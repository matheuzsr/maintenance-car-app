name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maintenance_car_test
          POSTGRES_USER: maintenance_car
          POSTGRES_PASSWORD: maintenance_car
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maintenance_car -d maintenance_car_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://maintenance_car:maintenance_car@localhost:5432/maintenance_car_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-replace-outside-ci
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-replace-outside-ci
      JWT_REFRESH_EXPIRES_IN: 30d
      VAPID_SUBJECT: mailto:ci@example.com
      VAPID_PUBLIC_KEY: ci-placeholder-public-key
      VAPID_PRIVATE_KEY: ci-placeholder-private-key
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Seed maintenance templates
        run: npm run prisma:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: End-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build
