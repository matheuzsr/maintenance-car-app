services:
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      target: development
    command: npm run start:dev
    env_file: app/backend/.env
    environment:
      DATABASE_URL: postgresql://maintenance_car:maintenance_car@postgres:5432/maintenance_car?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./app/backend/src:/workspace/app/backend/src
      - ./app/backend/prisma:/workspace/app/backend/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
      target: development
    command: npm run start:worker:dev
    env_file: app/backend/.env
    environment:
      DATABASE_URL: postgresql://maintenance_car:maintenance_car@postgres:5432/maintenance_car?schema=public
      REDIS_URL: redis://redis:6379
    profiles: ['worker']
    restart: unless-stopped
    volumes:
      - ./app/backend/src:/workspace/app/backend/src
      - ./app/backend/prisma:/workspace/app/backend/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
      target: development
    command: npm run dev
    env_file: app/frontend/.env
    ports:
      - '${FRONTEND_PORT:-3001}:3001'
    volumes:
      - ./app/frontend:/workspace/app/frontend
      - ./packages/api-contract:/workspace/packages/api-contract
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maintenance_car
      POSTGRES_USER: maintenance_car
      POSTGRES_PASSWORD: maintenance_car
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maintenance_car -d maintenance_car']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
